<!DOCTYPE html>
<html>
<head>
    <title>Remote Control</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }

        canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
        }

        button {
            padding: 8px;
            margin-right: 5px;
        }
    </style>
</head>

<body>

<div id="controls">
    <button onclick="switchScreen(0)">Screen 1</button>
    <button onclick="switchScreen(1)">Screen 2</button>
</div>

<canvas id="screen" tabindex="0"></canvas>

<script>

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

const ws = new WebSocket(`wss://${location.host}`);

canvas.focus();

// ===== SCREEN RENDER =====
ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === "screen") {
        const img = new Image();
        img.src = "data:image/png;base64," + data.image;

        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
        };
    }
};

// ===== INPUT =====
function send(obj) {
    if (ws.readyState === 1) {
        ws.send(JSON.stringify(obj));
    }
}

canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();

    send({
        type: "mousemove",
        x: (e.clientX / rect.width) * canvas.width,
        y: (e.clientY / rect.height) * canvas.height
    });
});

canvas.addEventListener("mousedown", () => {
    send({ type: "mousedown" });
});

canvas.addEventListener("mouseup", () => {
    send({ type: "mouseup" });
});

document.addEventListener("keydown", (e) => {
    e.preventDefault();

    send({
        type: "keydown",
        key: e.key
    });
}, true);

document.addEventListener("keyup", (e) => {
    e.preventDefault();

    send({
        type: "keyup",
        key: e.key
    });
}, true);

// ===== MULTI MONITOR SWITCH =====
function switchScreen(index) {
    send({
        type: "switchScreen",
        index
    });
}

</script>

</body>
</html>
